codecov:
  notify:
    after_n_builds: 2
    wait_for_ci: false
    hide_project_coverage: true

  require_ci_to_pass: false

coverage:
  range: 10..100
  status:
    project:
      default:
        target: false  # Disabling project target for now
      app:
        target: 30%
        paths:
          - src/

    patch:
      default:
        target: 75%
      app:
        target: 75%
        paths:
          - src/
